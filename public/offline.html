<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#07110f">
    <title>Signal Lost — LaunchWatch</title>
    <style>
      :root {
        color-scheme: dark;
        --graphite: #050807;
        --panel: #09100e;
        --line: rgba(0, 255, 136, 0.22);
        --green: #00ff88;
        --cyan: #00d4ff;
        --text: #e8edf5;
        --muted: #a4acb9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow-x: hidden;
        overflow-y: auto;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 8%, rgba(0, 212, 255, 0.12), transparent 34%),
          radial-gradient(circle at 12% 20%, rgba(0, 255, 136, 0.1), transparent 28%),
          var(--graphite);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.55;
        background-image:
          linear-gradient(rgba(0, 255, 136, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 136, 0.035) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      main {
        position: relative;
        width: min(100%, 620px);
        border: 1px solid var(--line);
        padding: clamp(28px, 7vw, 56px);
        background: rgba(9, 16, 14, 0.92);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.52);
      }

      main::before,
      main::after {
        content: "";
        position: absolute;
        width: 54px;
        height: 54px;
        pointer-events: none;
      }

      main::before {
        inset: -1px auto auto -1px;
        border-top: 2px solid var(--green);
        border-left: 2px solid var(--green);
      }

      main::after {
        inset: auto -1px -1px auto;
        border-right: 2px solid var(--cyan);
        border-bottom: 2px solid var(--cyan);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 40px;
        color: var(--green);
        font: 700 0.76rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(0, 212, 255, 0.35);
        color: var(--cyan);
      }

      .mark svg {
        width: 24px;
        height: 24px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--cyan);
        font: 700 0.72rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
        text-wrap: balance;
      }

      .status {
        max-width: 48ch;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      button,
      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 0;
        font: 700 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
      }

      button {
        border: 1px solid var(--green);
        color: #001c10;
        background: var(--green);
      }

      a {
        border: 1px solid rgba(0, 212, 255, 0.42);
        color: var(--cyan);
        background: transparent;
      }

      button:hover {
        background: #4dffad;
      }

      a:hover {
        border-color: var(--cyan);
        background: rgba(0, 212, 255, 0.08);
      }

      :focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 4px;
      }

      .telemetry {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 38px;
        color: var(--muted);
        font: 600 0.7rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 14px rgba(0, 255, 136, 0.72);
      }

      @media (max-width: 520px) {
        .actions {
          flex-direction: column;
        }

        button,
        a {
          width: 100%;
        }
      }

      @media (max-height: 620px) {
        body {
          place-items: start center;
        }

        main {
          margin-block: 16px;
          padding-block: 24px;
        }

        .brand {
          margin-bottom: 24px;
        }

        .status {
          margin-top: 16px;
        }

        .actions {
          margin-top: 22px;
        }

        .telemetry {
          margin-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3c-3.2 2.6-4.7 5.7-4.7 9.5l2.3 1.7h4.8l2.3-1.7C16.7 8.7 15.2 5.6 12 3Z" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="9" r="1.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="m9.5 15-1 3 3.5-1.6 3.5 1.6-1-3M12 17v4" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        LaunchWatch Mission Control
      </div>

      <p class="eyebrow">Network status // offline</p>
      <h1>Signal lost.</h1>
      <p class="status" role="status">
        Live mission data is temporarily out of range. Reconnect and retry to restore the launch board.
      </p>

      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry connection</button>
        <a href="/">Return to mission board</a>
      </div>

      <div class="telemetry" aria-hidden="true">
        <span class="dot"></span>
        Local shell online // awaiting network
      </div>
    </main>

    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
