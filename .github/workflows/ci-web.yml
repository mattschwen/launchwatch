name: Web CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  browser:
    name: ${{ matrix.name }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Desktop browser flows
            command: npm run test:e2e -- --project=desktop-chromium
            artifact: desktop
          - name: Mobile browser flows
            command: npm run test:e2e -- --project=mobile-chromium
            artifact: mobile
          - name: Accessibility smoke tests
            command: npm run test:a11y
            artifact: accessibility
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_PRODUCTION_SERVER: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build browser test application
        run: npm run build

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics-${{ matrix.artifact }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
