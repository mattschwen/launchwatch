<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05060a">
    <title>Signal Lost — LaunchWatch</title>
    <style>
      :root {
        color-scheme: dark;
        --graphite: #05060a;
        --panel: #080b12;
        --line: rgba(181, 204, 231, 0.2);
        --green: #63f6b2;
        --magenta: #ff4fd8;
        --red: #ff5c6c;
        --cyan: #58e6ff;
        --text: #f5f7ff;
        --muted: #9ca8ba;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding:
          max(24px, env(safe-area-inset-top, 0px))
          max(24px, env(safe-area-inset-right, 0px))
          max(24px, env(safe-area-inset-bottom, 0px))
          max(24px, env(safe-area-inset-left, 0px));
        overflow-x: hidden;
        overflow-y: auto;
        color: var(--text);
        background:
          radial-gradient(circle at 80% 2%, rgba(255, 79, 216, 0.14), transparent 34%),
          radial-gradient(circle at 10% 18%, rgba(88, 230, 255, 0.12), transparent 28%),
          var(--graphite);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.55;
        background-image:
          radial-gradient(circle, rgba(245, 247, 255, 0.15) 0.6px, transparent 0.8px),
          linear-gradient(rgba(88, 230, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 79, 216, 0.03) 1px, transparent 1px);
        background-size: 13px 17px, 40px 40px, 40px 40px;
      }

      main {
        position: relative;
        width: min(100%, 620px);
        border: 1px solid var(--line);
        padding: clamp(28px, 7vw, 56px);
        background:
          linear-gradient(145deg, rgba(88, 230, 255, 0.05), transparent 30%),
          rgba(8, 11, 18, 0.94);
        box-shadow:
          0 28px 80px rgba(0, 0, 0, 0.58),
          0 0 48px rgba(255, 79, 216, 0.06);
      }

      main::before,
      main::after {
        content: "";
        position: absolute;
        width: 54px;
        height: 54px;
        pointer-events: none;
      }

      main::before {
        inset: -1px auto auto -1px;
        border-top: 2px solid var(--magenta);
        border-left: 2px solid var(--magenta);
      }

      main::after {
        inset: auto -1px -1px auto;
        border-right: 2px solid var(--cyan);
        border-bottom: 2px solid var(--cyan);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 40px;
        color: var(--green);
        font: 700 0.76rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .mark {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(185, 197, 216, 0.18);
        border-radius: 10px;
        background: #111720;
      }

      .mark svg {
        width: 32px;
        height: 32px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--cyan);
        font: 700 0.72rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(2.5rem, 10vw, 5rem);
        line-height: 0.95;
        letter-spacing: -0.055em;
        text-wrap: balance;
        color: transparent;
        background: linear-gradient(105deg, var(--red), var(--magenta), var(--cyan));
        background-clip: text;
      }

      .status {
        max-width: 48ch;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      button,
      a {
        min-height: 46px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 0;
        font: 700 0.75rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
      }

      button {
        border: 1px solid var(--green);
        color: #001c10;
        background: var(--green);
      }

      a {
        border: 1px solid rgba(88, 230, 255, 0.42);
        color: var(--cyan);
        background: transparent;
      }

      button:hover {
        background: #4dffad;
      }

      a:hover {
        border-color: var(--cyan);
        background: rgba(88, 230, 255, 0.08);
      }

      :focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 4px;
      }

      .telemetry {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 38px;
        color: var(--muted);
        font: 600 0.7rem/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 14px rgba(0, 255, 136, 0.72);
      }

      @media (max-width: 520px) {
        .actions {
          flex-direction: column;
        }

        button,
        a {
          width: 100%;
        }
      }

      @media (max-height: 620px) {
        body {
          place-items: start center;
        }

        main {
          margin-block: 16px;
          padding-block: 24px;
        }

        .brand {
          margin-bottom: 24px;
        }

        .status {
          margin-top: 16px;
        }

        .actions {
          margin-top: 22px;
        }

        .telemetry {
          margin-top: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M8.5 27.5A16 16 0 0 1 31.5 8.7" stroke="#58E6FF" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M39.5 20.5A16 16 0 0 1 17.2 39.4" stroke="#FF4FD8" stroke-width="3.5" stroke-linecap="round"/>
            <path d="M16 35 36 15" stroke="#F5F7FF" stroke-width="4" stroke-linecap="round"/>
            <path d="m29.5 13.5 9-2.2-2.2 9" stroke="#63F6B2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="8.7" cy="27.6" r="2.6" fill="#58E6FF"/>
          </svg>
        </span>
        LaunchWatch Mission Control
      </div>

      <p class="eyebrow">Network status // offline</p>
      <h1>Signal lost.</h1>
      <p class="status" role="status">
        Live mission data is temporarily out of range. Reconnect and retry to restore the launch board.
      </p>

      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry connection</button>
        <a href="/">Return to mission board</a>
      </div>

      <div class="telemetry" aria-hidden="true">
        <span class="dot"></span>
        Local shell online // awaiting network
      </div>
    </main>

    <script>
      window.addEventListener('online', function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
